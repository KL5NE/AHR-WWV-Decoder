name: SDRangel 8.0.0 plugin — Windows MSVC

on:
  push:
    branches:
      - milestone-3-*
      - main
    paths:
      - 'plugin/**'
      - 'core/**'
      - 'sim/**'
      - 'sdrangel-integration/**'
      - '.github/workflows/windows-plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'core/**'
      - 'sim/**'
      - 'sdrangel-integration/**'
      - '.github/workflows/windows-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-windows:
    name: MSVC 2022 / Qt 6.9.3 / SDRangel v8.0.0
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout AHR plugin
        uses: actions/checkout@v4
        with:
          path: ahr

      - name: Checkout pinned SDRangel v8.0.0
        uses: actions/checkout@v4
        with:
          repository: f4exb/sdrangel
          ref: v8.0.0
          path: sdrangel
          submodules: recursive

      - name: Prepare Windows build environment
        shell: pwsh
        run: |
          choco install ninja patch --yes --no-progress
          cmake --version
          ninja --version

      - name: Activate MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.9.3 matching SDRangel release
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          dir: 'C:/'
          arch: win64_msvc2022_64
          setup-python: 'false'
          modules: 'qtcharts qtscxml qt5compat qtlocation qtmultimedia qtpositioning qtserialport qtspeech qtwebsockets qtwebengine qtshadertools qtwebchannel'

      - name: Install Boost 1.73 headers matching release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:/Libraries' | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/boost" | Out-Null
          $archive = "$env:RUNNER_TEMP/boost/boost.tar.bz2"
          curl.exe --fail --location --retry 3 --output "$archive" "https://archives.boost.io/release/1.73.0/source/boost_1_73_0.tar.bz2"
          if ($LASTEXITCODE -ne 0) { throw "Boost download failed" }
          7z x "$archive" "-o$env:RUNNER_TEMP/boost" -y -bd
          if ($LASTEXITCODE -ne 0) { throw "Boost bz2 extraction failed" }
          7z x "$env:RUNNER_TEMP/boost/boost.tar" "-oC:/Libraries" -y -bd
          if ($LASTEXITCODE -ne 0) { throw "Boost tar extraction failed" }
          if (!(Test-Path 'C:/Libraries/boost_1_73_0/boost/version.hpp')) { throw "Boost headers missing" }

      - name: Apply guarded SDRangel integration
        shell: pwsh
        run: |
          cmake -DSDRANGEL_SOURCE_DIR="$env:GITHUB_WORKSPACE/sdrangel" -P ahr/sdrangel-integration/apply_integration.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure native SDRangel plugin build
        shell: pwsh
        run: |
          $pluginDir = (Resolve-Path 'ahr/plugin').Path.Replace('\','/')
          cmake -S sdrangel -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_QT6=ON `
            -DARCH_OPT=SSE4_2 `
            -DDEBUG_OUTPUT=ON `
            -DENABLE_MIRISDR=OFF `
            -DBUILD_SERVER=OFF `
            "-DCMAKE_PREFIX_PATH=C:/Qt/6.9.3/msvc2022_64;C:/Libraries/boost_1_73_0" `
            "-DAHRWWV_PLUGIN_DIR=$pluginDir" `
            -DAHRWWV_BUILD_PLUGIN_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build plugin and integration tests
        shell: pwsh
        run: |
          cmake --build build --target ahrwwvtimedecoder ahrwwv_plugin_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage SDRangel's own runtime DLLs (SDRangel copy_* targets)
        shell: pwsh
        run: |
          # After sdrgui's windeployqt, stage SDRangel's complete pinned
          # Windows runtime set. Do not combine FFmpeg DLLs from Qt and SDRangel.
          $targets = @(ninja -C build -t targets all |
            ForEach-Object { ($_ -split ':')[0].Trim() } |
            Where-Object { $_ -match '^copy_[^/\\]+$' } |
            Sort-Object -Unique)
          if ($targets.Count -eq 0) { throw "No SDRangel copy_* staging targets found" }
          Write-Host "Running $($targets.Count) SDRangel staging targets"
          cmake --build build --target @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify every FFmpeg DLL matches SDRangel v8.0.0 pinned build
        shell: pwsh
        run: |
          $ref = 'sdrangel/external/windows/ffmpeg/bin'
          $bad = @()
          $sourceDlls = @(Get-ChildItem -Path $ref -Filter '*.dll')
          if ($sourceDlls.Count -eq 0) { throw "Pinned FFmpeg reference DLLs missing" }
          foreach ($refDll in $sourceDlls) {
            $built = Join-Path 'build/bin' $refDll.Name
            if (!(Test-Path -LiteralPath $built)) {
              $bad += "$($refDll.Name): missing from build/bin"
              continue
            }
            $expected = (Get-FileHash -LiteralPath $refDll.FullName -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath $built -Algorithm SHA256).Hash
            $match = $expected -eq $actual
            Write-Host "$($refDll.Name): $(if($match){'MATCH'}else{'MISMATCH'})"
            if (!$match) { $bad += "$($refDll.Name): mixed FFmpeg runtime" }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw "FFmpeg mismatch: refusing to run integration tests"
          }

      - name: Run SDRangel plugin integration tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/build/bin;$env:PATH;C:/Qt/6.9.3/msvc2022_64/bin"
          $env:QT_QPA_PLATFORM = "offscreen"
          Push-Location build/bin
          try {
            Write-Host "=== Required runtime files ==="
            Get-Item '.\ahrwwv_plugin_tests.exe', '.\plugins\ahrwwvtimedecoder.dll', '.\sdrbase.dll', '.\sdrgui.dll' |
              Select-Object Name, Length | Format-Table -AutoSize
            Write-Host "=== DLL dependencies ==="
            dumpbin /dependents '.\plugins\ahrwwvtimedecoder.dll'
            Write-Host "=== Test executable dependencies ==="
            dumpbin /dependents '.\ahrwwv_plugin_tests.exe'
            Write-Host "=== SDRangel core DLL dependencies ==="
            dumpbin /dependents '.\sdrbase.dll'
            Write-Host "=== SDRangel GUI DLL dependencies ==="
            dumpbin /dependents '.\sdrgui.dll'
            Write-Host "=== Deployed DLL files in build/bin ==="
            Get-ChildItem -Path . -Filter '*.dll' | Select-Object -ExpandProperty Name
            Write-Host "=== Diagnose missing DLLs and imported procedures recursively ==="
            python -m pip install --quiet pefile
            python '../../ahr/tools/check_windows_pe_deps.py' 'ahrwwv_plugin_tests.exe' 'plugins/ahrwwvtimedecoder.dll' --ffmpeg-reference '../../sdrangel/external/windows/ffmpeg/bin'
            Write-Host "Static PE diagnostics exit code: $LASTEXITCODE (informational)"
            # Static PE export checks can report false positives for Qt and Swagger.
            # Their result must not override the actual Windows loader test.
            $global:LASTEXITCODE = 0
            Write-Host "=== Running integration tests ==="
            $p = Start-Process -FilePath '.\ahrwwv_plugin_tests.exe' -ArgumentList 'plugins/ahrwwvtimedecoder.dll' -WorkingDirectory (Get-Location).Path -Wait -PassThru -NoNewWindow -RedirectStandardOutput 'test-stdout.txt' -RedirectStandardError 'test-stderr.txt'
            Write-Host "=== Integration test stdout ==="
            if (Test-Path 'test-stdout.txt') { Get-Content 'test-stdout.txt' }
            Write-Host "=== Integration test stderr ==="
            if (Test-Path 'test-stderr.txt') { Get-Content 'test-stderr.txt' }
            Write-Host "Integration test exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "Windows integration tests failed with exit code $($p.ExitCode)" }
          } finally {
            Pop-Location
          }
          # The real integration executable returned 0. Explicitly clear the
          # prior informational Python scanner's exit code for the pwsh runner.
          exit 0

      - name: Windows loader snaps on failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $dbg = 'C:/Program Files (x86)/Windows Kits/10/Debuggers/x64'
          if (!(Test-Path "$dbg/cdb.exe")) { Write-Host "Windows debugger unavailable"; exit 0 }
          $env:PATH = "$env:GITHUB_WORKSPACE/build/bin;$env:PATH;C:/Qt/6.9.3/msvc2022_64/bin"
          $env:QT_QPA_PLATFORM = "offscreen"
          Push-Location build/bin
          try {
            & "$dbg/gflags.exe" -i ahrwwv_plugin_tests.exe +sls | Out-Host
            & "$dbg/cdb.exe" -g -G -o -logo loader-snaps.txt -c "q" .\ahrwwv_plugin_tests.exe plugins/ahrwwvtimedecoder.dll | Out-Null
            & "$dbg/gflags.exe" -i ahrwwv_plugin_tests.exe -sls | Out-Host
            if (Test-Path loader-snaps.txt) {
              Select-String -Path loader-snaps.txt -Pattern 'could not be located|Procedure|LdrpSnapModule|LdrpNameToOrdinal|STATUS_' |
                Select-Object -Last 40 | ForEach-Object { $_.Line }
            }
          } finally { Pop-Location }

      - name: Preserve Windows test binaries for loader diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AHR-WWV-Windows-loader-triage-UNVERIFIED
          path: |
            build/bin/ahrwwv_plugin_tests.exe
            build/bin/sdrbase.dll
            build/bin/sdrgui.dll
            build/bin/plugins/ahrwwvtimedecoder.dll
            build/bin/libfftw3f-3.dll
            build/bin/libsigmf.dll
            build/bin/av*.dll
            build/bin/sw*.dll
            build/bin/postproc-*.dll
          if-no-files-found: warn
          retention-days: 5

      - name: Upload integration-test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AHR-WWV-Windows-integration-diagnostics
          path: |
            build/bin/test-stdout.txt
            build/bin/test-stderr.txt
            build/bin/loader-snaps.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Create unverified Windows DLL test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dll-package | Out-Null
          $dll = 'build/bin/plugins/ahrwwvtimedecoder.dll'
          if (!(Test-Path $dll)) { throw "Expected DLL not found at $dll" }
          Copy-Item $dll 'dll-package/ahrwwvtimedecoder.dll'
          Copy-Item 'ahr/docs/M3-PLUGIN.md' 'dll-package/M3-PLUGIN.md'
          @'
          AHR WWV/WWVH SDRangel v8.0.0 plugin — EXPERIMENTAL

          Automated CI artifact only. Build/test success does not prove
          compatibility with your installed SDRangel application.
          Do not distribute as a stable installer until verified on HAMBEAST.

          Before testing: close SDRangel; back up the plugins directory.
          After approval: copy DLL to the correct SDRangel plugins folder.
          On failure: remove ONLY this DLL and inspect SDRangel plugin logs.
          This plugin does NOT change the Windows clock.
          '@ | Set-Content 'dll-package/READ-ME-FIRST.txt'
          $hash = (Get-FileHash 'dll-package/ahrwwvtimedecoder.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ahrwwvtimedecoder.dll" | Set-Content 'dll-package/SHA256SUMS.txt'
          Compress-Archive -Path 'dll-package/*' -DestinationPath 'AHR-WWV-v8.0.0-win64-DLL-test.zip' -Force

      - name: Upload test DLL package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AHR-WWV-v8.0.0-win64-DLL-test
          path: AHR-WWV-v8.0.0-win64-DLL-test.zip
          if-no-files-found: error
          retention-days: 30

      - name: Show build disk use
        if: always()
        shell: pwsh
        run: Get-PSDrive
